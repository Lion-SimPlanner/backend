name: Backend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LionSimPlanner.slnx

    - name: Build
      run: dotnet build LionSimPlanner.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test LionSimPlanner.slnx --configuration Release --no-build --verbosity normal